<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>撮影地帳 | 鉄道・バス撮影スポットマップ</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="header-tape"></div>
  <h1 class="app-title"><span class="title-jp">撮影地帳</span><span class="title-en">PHOTO SPOT MAP</span></h1>
  <p class="app-sub">鉄道・バスの撮影スポットを記録する地図ノート</p>
</header>

<div class="app-body">

  <nav class="filter-bar" aria-label="カテゴリで絞り込み">
    <button class="chip is-active" data-filter="all">すべて</button>
    <button class="chip chip-rail" data-filter="rail">鉄道</button>
    <button class="chip chip-bus" data-filter="bus">バス</button>
    <button class="chip chip-flower" data-filter="flower">花・風景</button>
  </nav>

  <main class="map-pane">
    <div id="map"></div>
    <button class="locate-btn" id="locateBtn" aria-label="現在地を取得">
      <span class="locate-icon" id="locateIcon">◎</span>
    </button>
  </main>

  <aside class="spot-drawer" id="spotDrawer">
    <button class="drawer-handle" id="drawerHandle" aria-label="一覧の開閉">
      <span class="handle-bar"></span>
      <span class="handle-label"><span id="spotCount">0</span> 件のスポット</span>
    </button>
    <div class="drawer-toolbar">
      <button class="sort-toggle" id="sortToggle" aria-pressed="false">
        <span class="sort-icon">◎</span> 現在地から近い順
      </button>
      <p class="locate-status" id="locateStatus"></p>
    </div>
    <div class="spot-list" id="spotList"></div>
  </aside>

</div>

<div class="ticket-overlay" id="ticketOverlay">
  <div class="ticket-card" id="ticketCard">
    <button class="ticket-close" id="ticketClose" aria-label="閉じる">×</button>
    <div class="ticket-photo" id="ticketPhoto"></div>
    <div class="ticket-body">
      <span class="ticket-category" id="ticketCategory"></span>
      <h2 class="ticket-name" id="ticketName"></h2>
      <p class="ticket-line" id="ticketLine"></p>
      <p class="ticket-memo" id="ticketMemo"></p>
      <p class="ticket-season" id="ticketSeason"></p>
      <div class="ticket-punch"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
